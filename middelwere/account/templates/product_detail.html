{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<h2>🛒 {{ product.name }}</h2>

<ul class="list-group">
    <li class="list-group-item"><b>Price:</b> ₹{{ product.price }}</li>
    <li class="list-group-item"><b>Slug:</b> {{ product.slug }}</li>
</ul>

<a href="/products/" class="btn btn-secondary mt-3">Back</a>
{% endblock %}
