{% extends 'base.html' %}

{% block title %}Products{% endblock %}

{% block content %}
<h2>📦 Product List</h2>

<table class="table table-bordered">
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>View</th>
    </tr>

    {% for product in products %}
    <tr>
        <td>{{ product.name }}</td>
        <td>₹{{ product.price }}</td>
        <td>
            <a href="{% url 'product_detail' product.slug %}" class="btn btn-primary btn-sm">
                View
            </a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No products found</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
