<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<body class="bg-light">

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <aside class="col-md-3 col-lg-2 bg-dark min-vh-100 p-3">
      <h5 class="text-white text-center mb-4">FurniForma</h5>

      <ul class="nav nav-pills flex-column gap-2">
        <li class="nav-item">
          <a href="{% url 'admin_dashboard' %}" class="nav-link text-white">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a href="{% url 'add_product' %}" class="nav-link text-white active">
            <i class="bi bi-plus-circle me-2"></i> Add Product
          </a>
        </li>

        <li class="nav-item">
          <a href="{% url 'admin_categories' %}" class="nav-link text-white">
            <i class="bi bi-tags me-2"></i> Categories
          </a>
        </li>

        <li class="nav-item">
          <a href="{% url 'admin_personal_details' %}" class="nav-link text-white">
            <i class="bi bi-person me-2"></i> Personal Details
          </a>
        </li>

        <li class="nav-item mt-3">
          <a href="{% url 'admin_logout' %}" class="nav-link text-danger">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </a>
        </li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="col-md-9 col-lg-10 p-4">

      <div class="card shadow" style="max-width: 700px;">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Add Product</h4>
        </div>

        <div class="card-body">
          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label">Product Name</label>
              <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Price</label>
              <input type="number" name="price" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Category</label>
              <select name="category" class="form-select" required>
                <option value="">Select Category</option>
                {% for cat in categories %}
                  <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Product Image</label>
              <input type="file" name="image" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100">
              Save Product
            </button>

          </form>
        </div>
      </div>

    </main>

  </div>
</div>

</body>
