<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <aside class="col-md-3 col-lg-2 bg-dark min-vh-100 p-3">
      <h5 class="text-white text-center mb-4">FurniForma</h5>

      <ul class="nav nav-pills flex-column gap-2">

        <li class="nav-item">
          <a href="{% url 'admin_dashboard' %}" class="nav-link text-white">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a href="{% url 'add_product' %}" class="nav-link text-white">
            <i class="bi bi-plus-circle me-2"></i> Add Product
          </a>
        </li>

        <li class="nav-item">
          <a href="{% url 'admin_categories' %}" class="nav-link text-white">
            <i class="bi bi-tags me-2"></i> Categories
          </a>
        </li>

        <li class="nav-item">
          <a href="{% url 'admin_personal_details' %}" class="nav-link text-white">
            <i class="bi bi-person me-2"></i> Personal Details
          </a>
        </li>

        <li class="nav-item mt-3">
          <a href="{% url 'admin_logout' %}" class="nav-link text-danger">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </a>
        </li>

      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="col-md-9 col-lg-10 p-4">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Products</h2>
        <a href="{% url 'add_product' %}" class="btn btn-primary">
          <i class="bi bi-plus-lg"></i> Add Product
        </a>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">

          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Name</th>
                  <th>Price</th>
                  <th class="text-center">Action</th>
                </tr>
              </thead>
              <tbody>
                {% for p in products %}
                <tr>
                  <td>{{ p.name }}</td>
                  <td>₹ {{ p.price }}</td>
                  <td class="text-center">
                    <a href="{% url 'edit_product' p.id %}" class="btn btn-sm btn-warning">
                      <i class="bi bi-pencil"></i> Edit
                    </a>
                    <a
                      href="{% url 'delete_product' p.id %}"
                      class="btn btn-sm btn-danger"
                      onclick="return confirm('Are you sure you want to delete this product?')"
                    >
                      <i class="bi bi-trash"></i> Delete
                    </a>
                  </td>
                </tr>
                {% empty %}
                <tr>
                  <td colspan="3" class="text-center text-muted">
                    No products found
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>

        </div>
      </div>

    </main>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
