<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Optional Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <aside class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
      <h4 class="text-center mb-4">FurniForma</h4>

      <ul class="nav nav-pills flex-column gap-2">
        <li class="nav-item">
          <a href="{% url 'admin_dashboard' %}" class="nav-link text-white active">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="{% url 'admin_products' %}" class="nav-link text-white">
            <i class="bi bi-box-seam me-2"></i> Products
          </a>
        </li>
        <li class="nav-item">
          <a href="{% url 'admin_categories' %}" class="nav-link text-white">
            <i class="bi bi-tags me-2"></i> Categories
          </a>
        </li>
        <li class="nav-item">
          <a href="{% url 'admin_personal_details' %}" class="nav-link text-white"> <i class="bi bi-tags me-2"></i> Personal Detail </a>
        </li>
        <li class="nav-item mt-3">
          <a href="{% url 'admin_logout' %}" class="nav-link text-danger">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="col-md-9 col-lg-10 p-4">
      <h2 class="mb-4">Dashboard</h2>

      <div class="row g-4">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">Total Products</h5>
              <p class="display-6 fw-bold">{{ product_count }}</p>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">Total Categories</h5>
              <p class="display-6 fw-bold">{{ category_count }}</p>
            </div>
          </div>
        </div>
      </div>

    </main>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
