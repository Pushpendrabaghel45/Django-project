<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Category</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <aside class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
      <h4 class="text-center mb-4">FurniForma</h4>

      <ul class="nav nav-pills flex-column gap-2">
        <li class="nav-item">
          <a href="{% url 'admin_dashboard' %}" class="nav-link text-white">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a href="{% url 'admin_products' %}" class="nav-link text-white">
            <i class="bi bi-box-seam me-2"></i> Products
          </a>
        </li>

        <li class="nav-item">
          <a href="{% url 'admin_categories' %}" class="nav-link text-white active">
            <i class="bi bi-tags me-2"></i> Categories
          </a>
        </li>

        <li class="nav-item">
          <a href="{% url 'admin_personal_details' %}" class="nav-link text-white">
            <i class="bi bi-person me-2"></i> Personal Detail
          </a>
        </li>

        <li class="nav-item mt-3">
          <a href="{% url 'admin_logout' %}" class="nav-link text-danger">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </a>
        </li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="col-md-9 col-lg-10 p-4">
      <div class="card shadow-sm" style="max-width: 500px;">
        <div class="card-body">

          <h4 class="mb-3">Add Category</h4>

          <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label">Category Name</label>
              <input type="text" name="name" class="form-control" placeholder="Enter category name" required>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success w-50">
                Save
              </button>
              <a href="{% url 'admin_categories' %}" class="btn btn-secondary w-50">
                Back
              </a>
            </div>

          </form>

        </div>
      </div>
    </main>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
