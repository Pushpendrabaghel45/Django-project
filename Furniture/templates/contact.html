<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Contact Us | Furniture</title>
  <link rel="stylesheet" href="/static/assets/CSS/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>

  <div class="top-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="top-left">
        info@furniforma.com
      </div>
      <div class="top-right">
        <a href="{% url 'admin_login' %}">Login</a>

      </div>
    </div>
  </div>

  <header class="header">
    <div class="container d-flex justify-content-between align-items-center">
      <img class="logo" src="/static/assets/Images/final2.png" alt>

      <div class="social-header-icons">
        <i class="bi bi-instagram"></i>
        <i class="bi bi-facebook"></i>
        <i class="bi bi-twitter-x"></i>
        <i class="bi bi-youtube"></i>
      </div>

    </div>
  </header>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto gap-4">

          <li class="nav-item">
            <a class="nav-link" href="{% url 'home' %}">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{% url 'shop' %}">Shop</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{% url 'pages' %}">Pages</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{% url 'blog' %}">Blog</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{% url 'contact' %}">Contact</a>
          </li>

        </ul>
      </div>

    </div>
  </nav>
  <section class="container py-5">
    <div class="row">
      <div class="col-md-6 fade-up">
        <h2>Get in Touch</h2>
        <p>We’d love to hear from you.</p>

        <form>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Your Name">
          </div>
          <div class="form-group">
            <input type="email" class="form-control" placeholder="Email Address">
          </div>
          <div class="form-group">
            <textarea class="form-control" rows="4" placeholder="Message"></textarea>
          </div>
          <button class="btn btn-dark">Send Message</button>
        </form>
      </div>

      <div class="col-md-6 fade-up">
        <img src="/static/assets/Images/Contact-us-formimg-01-768x218.png" class="img-fluid rounded">
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="row">

        <div class="col-lg-4">
          <h4>FurniForma</h4>
          <p>Premium furniture crafted for modern homes.</p>
        </div>

        <div class="col-lg-4">
          <h5>Contact</h5>
          <p>Ahmedabad, Gujarat</p>
        </div>

        <div class="col-lg-4">
          <h5>Collections</h5>
          <ul>
            <li>Living Room</li>
            <li>Bedroom</li>
            <li>Office</li>
          </ul>
        </div>

      </div>
      <div class="footer-bottom">
        © 2025 FurniForma — College Project
      </div>
    </div>
  </footer>

  <script src="/static/assets/JS/main.js"></script>
</body>

</html>
